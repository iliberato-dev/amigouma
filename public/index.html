<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="cgnjD8tlwXRoMX3zTdjIsRNzw5eesOQNLTBRF3nRpSs" />
    <title>Cadastro UMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="https://storage.googleapis.com/ecdt-logos/62769500000140/igreja_evangelica_assembleia_de_deus_em_sao_paulo_62769500.webp"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="brand-header">
      <div class="logo-badge">
        <img
          class="logo-photo"
          src="assets/logo_umadeb.png"
          alt="Foto AD Min Belem Setor 53"
        />
      </div>
      <div class="brand-text">
        <strong>UMADEB</strong>
        <span>Setor 53</span>
      </div>
    </header>
    <nav>
      <button onclick="showForm()">Cadastro</button>
      <button onclick="showCount()">Cadastrados</button>
      <button id="auth-button" type="button">Entrar</button>
      <label
        class="nav-toggle"
        for="transition-toggle"
        title="Ativar ou retirar a animação"
      >
        <span class="nav-toggle-label">Fx</span>
        <span class="nav-switch">
          <input
            id="transition-toggle"
            type="checkbox"
            role="switch"
            aria-label="Ativar animação"
          />
          <span class="nav-switch-track" aria-hidden="true">
            <span class="nav-switch-thumb"></span>
          </span>
        </span>
      </label>
      <a
        id="sheet-link"
        class="nav-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        >Abrir Tabela</a
      >
    </nav>
    <main id="main-content">
      <!-- Conteúdo dinâmico -->
    </main>
    <script src="script.js"></script>
  </body>
</html>
