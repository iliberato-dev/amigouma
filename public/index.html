  <body>
    <header class="brand-header">
      <div class="logo-badge">
        <img

          src="assets/logo_umadeb.png"

        />
      </div>

        <strong>UMADEB</strong>

    <nav>
      <button onclick="showForm()">Cadastro</button>
      <button onclick="showCount()">Cadastrados</button>
      <button id="auth-button" type="button">Entrar</button>
      <label
        class="nav-toggle"
        for="transition-toggle"
        title="Ativar ou retirar a animação"
      >
        <span class="nav-toggle-label">Fx</span>
        <span class="nav-switch">
          <input
            id="transition-toggle"
            type="checkbox"
            role="switch"
            aria-label="Ativar animação"
          />
          <span class="nav-switch-track" aria-hidden="true">
            <span class="nav-switch-thumb"></span>
          </span>
        </span>
      </label>
      <a
        id="sheet-link"
        class="nav-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        >Abrir Tabela</a
      >
